name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which worker to roll back
        type: choice
        options: [both, web, realtime]
        default: both

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Roll back realtime
        if: inputs.target != 'web'
        working-directory: apps/realtime
        run: pnpm exec wrangler rollback --message "manual rollback ${{ github.run_id }}" -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Roll back web
        if: inputs.target != 'realtime'
        working-directory: apps/web
        run: pnpm exec wrangler rollback --message "manual rollback ${{ github.run_id }}" -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

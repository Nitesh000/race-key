name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_NEON: ${{ secrets.NEON_API_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Create Neon branch
        id: neon
        if: env.HAS_NEON == 'true'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: e2e-${{ github.run_id }}-${{ matrix.browser }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Migrate
        if: steps.neon.outputs.db_url != ''
        run: pnpm --filter @race-key/db migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: tests/e2e

      - run: pnpm turbo run build --filter=@race-key/web
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - run: pnpm --filter @race-key/e2e test --project=${{ matrix.browser }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
